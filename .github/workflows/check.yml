name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts the text measurement needs (metric-compatible Calibri/Cambria/Arial twins)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 fonts-dejavu

      - name: The kSharedPy master (generated modules come from it)
        uses: actions/checkout@v4
        with:
          repository: PeterKalmstrom/kSharedPy
          path: _kSharedPy
      - name: Generated modules match the kSharedPy master and are not hand-edited
        # The checkout is removed afterwards so the later checks (docs, kpattern) only see this skill
        run: |
          python _kSharedPy/kpy/kPyCompiler.py --manifest kpy.manifest.json --action verify --shared-root _kSharedPy
          rm -rf _kSharedPy

      - name: Install dependencies
        run: pip install python-pptx pillow numpy jsonschema
      - name: Compile scripts
        run: python -m py_compile scripts/*.py tools/*.py mcp-app/*.py
      - name: Every function follows the kShared error pattern
        run: python tools/check_kpattern.py
      - name: Docs links, anchors and SKILL.md budget
        run: python tools/check_docs.py
      - name: Self-test (scripts that need no PowerPoint)
        run: python scripts/selftest.py
      - name: Self-test with only the CI runner's fonts
        run: python scripts/selftest.py --ci-fonts
      - name: Trigger evals are well-formed
        run: python tools/check_evals.py
