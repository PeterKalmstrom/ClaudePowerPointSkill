<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerPoint Live</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #c43e1c; }
  :root[data-theme="dark"] { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #f0883e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  .wrap { padding: 8px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--line); border-radius: 6px;
           overflow: hidden; display: grid; place-items: center; color: var(--muted); }
  .stage img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .stage.flash { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .bar .info { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .muted { color: var(--muted); }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
           border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: #2da44e; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tabs button[aria-selected="true"] { background: var(--line); }
  .sec { margin: 10px 0 4px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .sec .muted { font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; min-height: 40px;
          padding: 4px; border-radius: 6px; }
  .grid.over-end { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .thumb { position: relative; cursor: grab; user-select: none; }
  .thumb .pic { aspect-ratio: 16 / 9; background: var(--line); border-radius: 4px; overflow: hidden;
                border: 2px solid transparent; }
  .thumb .pic img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .thumb.current .pic { border-color: var(--accent); }
  .thumb.hidden .pic { opacity: .45; }
  .thumb.dragging { opacity: .35; }
  .thumb.over-before::before { content: ""; position: absolute; left: -6px; top: 0; bottom: 18px; width: 3px;
                               border-radius: 2px; background: var(--accent); }
  .thumb .cap { display: flex; gap: 4px; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .thumb .cap b { color: var(--fg); }
  .thumb .cap span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  [hidden] { display: none !important; }
  .err { color: var(--accent); margin-top: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-slide" aria-selected="true">Slide</button>
    <button role="tab" id="tab-sorter" aria-selected="false">Slide sorter</button>
  </div>
  <div id="sorter" hidden></div>
  <div id="single">
  <div class="stage" id="stage"><span id="placeholder">Waiting for PowerPoint…</span></div>
  <div class="bar">
    <span class="dot" id="dot" title="live"></span>
    <span class="info"><b id="pos">–</b> <span class="muted" id="deck"></span></span>
    <span class="muted" id="when"></span>
    <button id="prev" aria-label="Previous slide">‹</button>
    <button id="next" aria-label="Next slide">›</button>
  </div>
  </div>
  <div class="err" id="err" hidden></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let nextId = 1, pending = new Map(), state = null, shown = null, busy = false;

  function send(msg) { window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function structured(result) {
    if (result && result.structuredContent) {
      const s = result.structuredContent;
      return s.result && typeof s.result === "object" ? s.result : s;
    }
    const t = result && result.content && result.content.find(c => c.type === "text");
    try { return t ? JSON.parse(t.text) : null; } catch { return null; }
  }
  const call = async (name, args = {}) => {
    const r = await request("tools/call", { name, arguments: args });
    if (r && r.isError) throw new Error((r.content || []).map(c => c.text).join(" ") || "tool error");
    return structured(r);
  };

  function applyTheme(ctx) {
    if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme;
  }
  function reportSize() {
    send({ method: "ui/notifications/size-changed",
           params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } });
  }
  function showError(e) {
    $("err").hidden = !e; $("err").textContent = e ? String(e.message || e) : "";
    $("dot").classList.toggle("live", !e); reportSize();
  }
  function render(s) {
    $("pos").textContent = s.count ? `Slide ${s.slide} / ${s.count}` : "No slides";
    $("deck").textContent = s.deck || "";
    $("prev").disabled = !s.count || s.slide <= 1;
    $("next").disabled = !s.count || s.slide >= s.count;
  }

  let mode = "slide", outline = null, outlineKey = null, thumbs = new Map(), dragId = null;
  function setMode(m) {
    mode = m;
    $("tab-slide").setAttribute("aria-selected", m === "slide");
    $("tab-sorter").setAttribute("aria-selected", m === "sorter");
    $("single").hidden = m !== "slide"; $("sorter").hidden = m !== "sorter";
    m === "sorter" ? refreshSorter(true) : refresh(true);
  }
  $("tab-slide").onclick = () => setMode("slide");
  $("tab-sorter").onclick = () => setMode("sorter");

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function clearMarks() { document.querySelectorAll(".over-before,.over-end").forEach(e => e.classList.remove("over-before", "over-end")); }

  async function move(args) {
    try { await call("powerpoint_move", args); await refreshSorter(true); }
    catch (e) { showError(e); }
  }

  function buildSorter(o) {
    const root = $("sorter"); root.textContent = "";
    const byId = new Map(o.slides.map(s => [s.id, s]));
    for (const sec of o.sections) {
      if (sec.name || o.sections.length > 1) {
        const h = el("div", "sec", sec.name || "Untitled section");
        h.appendChild(el("span", "muted", `${sec.slides.length} slide${sec.slides.length === 1 ? "" : "s"}`));
        root.appendChild(h);
      }
      const grid = el("div", "grid"); grid.dataset.section = sec.index;
      for (const id of sec.slides) {
        const s = byId.get(id);
        const t = el("div", "thumb" + (s.index === o.slide ? " current" : "") + (s.hidden ? " hidden" : ""));
        t.draggable = true; t.dataset.id = id; t.tabIndex = 0;
        t.title = s.title || `Slide ${s.index}`;
        const pic = el("div", "pic"); const cached = thumbs.get(id);
        if (cached && cached.signature === s.signature) { const i = el("img"); i.alt = t.title; i.src = "data:image/png;base64," + cached.png; pic.appendChild(i); }
        t.appendChild(pic);
        const cap = el("div", "cap"); cap.appendChild(el("b", null, String(s.index))); cap.appendChild(el("span", null, s.title));
        t.appendChild(cap);
        t.addEventListener("click", async () => {
          try { await call("powerpoint_show", { slide: s.index }); setMode("slide"); } catch (e) { showError(e); }
        });
        t.addEventListener("dragstart", ev => { dragId = id; t.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", String(id)); });
        t.addEventListener("dragend", () => { t.classList.remove("dragging"); clearMarks(); dragId = null; });
        t.addEventListener("dragover", ev => { if (dragId == null) return; ev.preventDefault(); ev.stopPropagation(); clearMarks(); t.classList.add("over-before"); });
        t.addEventListener("drop", ev => { ev.preventDefault(); ev.stopPropagation(); const d = dragId; clearMarks(); if (d != null && d !== id) move({ slide_id: d, before_slide_id: id }); });
        grid.appendChild(t);
      }
      grid.addEventListener("dragover", ev => { if (dragId == null) return; ev.preventDefault(); clearMarks(); grid.classList.add("over-end"); });
      grid.addEventListener("dragleave", ev => { if (!grid.contains(ev.relatedTarget)) grid.classList.remove("over-end"); });
      grid.addEventListener("drop", ev => {
        ev.preventDefault(); const d = dragId; clearMarks();
        if (d != null) move(Number(grid.dataset.section) ? { slide_id: d, section: Number(grid.dataset.section) } : { slide_id: d });
      });
      root.appendChild(grid);
    }
    reportSize();
  }

  async function loadThumbs(o) {
    const need = o.slides.filter(s => { const c = thumbs.get(s.id); return !c || c.signature !== s.signature; }).map(s => s.id);
    for (let i = 0; i < need.length; i += 6) {
      if (mode !== "sorter") return;
      const r = await call("slide_thumbs", { slide_ids: need.slice(i, i + 6), width: 320 });
      for (const t of (r && r.thumbs) || []) {
        thumbs.set(t.id, t);
        const pic = document.querySelector(`.thumb[data-id="${t.id}"] .pic`);
        if (pic) { pic.textContent = ""; const img = el("img"); img.alt = pic.parentElement.title; img.src = "data:image/png;base64," + t.png; pic.appendChild(img); }
      }
    }
  }

  async function refreshSorter(force) {
    if (busy || dragId != null) return;
    busy = true;
    try {
      const o = await call("deck_outline");
      outline = o; render(o); showError(null);
      const key = JSON.stringify([o.slide, o.sections.map(s => [s.name, s.slides]), o.slides.map(s => [s.signature, s.title, s.hidden])]);
      if (force || key !== outlineKey) { outlineKey = key; buildSorter(o); busy = false; await loadThumbs(o); }
    } catch (e) { showError(e); }
    finally { busy = false; }
  }

  async function refresh(force) {
    if (mode === "sorter") return refreshSorter(force);
    if (busy) return;
    busy = true;
    try {
      const s = await call("slide_state");
      state = s; render(s); showError(null);
      const key = `${s.path}|${s.slide}|${s.signature}`;
      if (force || key !== shown) {
        const width = Math.min(2560, Math.round($("stage").clientWidth * (window.devicePixelRatio || 1)));
        const img = await call("slide_image", { slide: s.slide, width: Math.max(320, width) });
        if (img && img.png) {
          let el = $("stage").querySelector("img");
          if (!el) { $("stage").textContent = ""; el = document.createElement("img"); $("stage").appendChild(el); }
          el.alt = `Slide ${img.slide} of ${s.deck}`;
          el.src = "data:image/png;base64," + img.png;
          $("stage").classList.add("flash"); setTimeout(() => $("stage").classList.remove("flash"), 350);
          $("when").textContent = new Date().toLocaleTimeString();
        }
        shown = `${s.path}|${img ? img.slide : s.slide}|${img ? img.signature : s.signature}`;
        reportSize();
      }
    } catch (e) { showError(e); }
    finally { busy = false; }
  }

  async function go(delta) {
    if (!state) return;
    try { await call("powerpoint_show", { slide: state.slide + delta }); await refresh(true); }
    catch (e) { showError(e); }
  }
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);

  window.addEventListener("message", ev => {
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") refresh(true);
    else if (m.method === "ui/notifications/host-context-changed") applyTheme(m.params);
    else if (m.method === "ui/resource-teardown" && m.id !== undefined) { clearInterval(timer); send({ id: m.id, result: {} }); }
  });

  let timer = null;
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    capabilities: { appCapabilities: {} },
    clientInfo: { name: "powerpoint-live-view", version: "1.0.0" },
    appCapabilities: {},
    appInfo: { name: "powerpoint-live-view", version: "1.0.0" }
  }).then(r => {
    applyTheme(r && r.hostContext);
    send({ method: "ui/notifications/initialized", params: {} });
    refresh(true);
    let tick = 0;
    timer = setInterval(() => { tick++; if (!document.hidden && (mode === "slide" || tick % 2 === 0)) refresh(false); }, 1000);
  }).catch(showError);
  new ResizeObserver(reportSize).observe(document.body);
})();
</script>
</body>
</html>
